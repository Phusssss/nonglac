<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigger Crawler - NôngLạc</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .status.loading {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
    }
    .status.success {
      background: #d4edda;
      border: 1px solid #28a745;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      border: 1px solid #dc3545;
      color: #721c24;
    }
    .info-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 Crawler Manager</h1>
    <p class="subtitle">Quản lý cào giá nông sản NôngLạc</p>

    <div class="info-box">
      <strong>ℹ️ Thông tin:</strong><br>
      • Crawler sẽ cào giá từ nhabeagri.com<br>
      • Thời gian: ~10-30 giây<br>
      • Dữ liệu sẽ được lưu vào Firestore
    </div>

    <button id="triggerBtn" class="btn btn-primary" onclick="triggerCrawler()">
      🚀 Chạy Crawler Ngay
    </button>

    <div id="status"></div>
  </div>

  <script>
    const FUNCTION_URL = 'https://asia-southeast1-nonglac-2026.cloudfunctions.net/crawlCoffeeManual';

    async function triggerCrawler() {
      const btn = document.getElementById('triggerBtn');
      const statusDiv = document.getElementById('status');
      
      btn.disabled = true;
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = '<div class="spinner"></div>Đang chạy crawler... Vui lòng đợi.';

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `
            <strong>✅ Thành công!</strong><br>
            • Số bảng giá: ${data.result.allTables?.length || 0}<br>
            • Thời gian: ${data.result.crawlDuration}ms<br>
            • Cập nhật: ${data.result.date}<br>
            <pre>${JSON.stringify(data.result.prices, null, 2)}</pre>
          `;
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `
          <strong>❌ Lỗi!</strong><br>
          ${error.message}<br>
          <small>Vui lòng thử lại sau.</small>
        `;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
